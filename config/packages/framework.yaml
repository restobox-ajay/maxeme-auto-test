# see https://symfony.com/doc/current/reference/configuration/framework.html
framework:
    secret: '%env(APP_SECRET)%'

    # Note that the session will be started ONLY if you read or write from it.
    session:
        # CSRF tokens are session-backed (SessionTokenStorage), so session lifetime IS the CSRF
        # token lifetime. 8 hours = one working day, so a form left open over a break still
        # submits instead of being rejected as stale.
        gc_maxlifetime: 28800
        cookie_lifetime: 28800

        # Must be project-local, not the shared /var/lib/php/sessions. The distro's `sessionclean`
        # timer sweeps that directory on the php.ini gc_maxlifetime (1440 = 24min) and ignores the
        # value set above at runtime — so leaving it shared would silently expire sessions, and
        # every open form with them, after 24 minutes regardless of this config.
        save_path: '%kernel.project_dir%/var/sessions'

    #esi: true
    #fragments: true

when@test:
    framework:
        test: true
        session:
            storage_factory_id: session.storage.factory.mock_file
