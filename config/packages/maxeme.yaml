# Maxeme Auto: the shop-specific configuration layered on top of core.
#
# Services live in config/services.yaml (App\Maxeme\ section); routes in config/routes/maxeme.yaml.

parameters:
    # Written to the app settings core reads for site_name() by `app:maxeme:setup`.
    maxeme.app_name: 'Maxeme Auto'
    maxeme.company_name: 'Maxeme Automotive Service Ltd.'
    # The shop's timezone. Written to core's `timezone` setting (every date is stored in UTC and
    # shown in this zone) by app:maxeme:setup, and the zone the legacy database's wall-clock times
    # are read in by app:maxeme:import-legacy.
    maxeme.timezone: 'America/Vancouver'

    # Appointment calendar (legacy calendar-setting.js / AppointmentController), in shop time.
    maxeme.schedule:
        day_start: '07:00'          # first bookable slot
        day_end: '19:00'            # the calendar's last hour ends here
        slot_minutes: 15
        busy_slot_count: 5          # a slot with this many appointments starting in it shows as full
        default_duration_hours: 2   # the booking form's Duration

    # How long a forgot-password link stays valid, and how long before another can be requested
    # (the legacy FOSUserBundle token_ttl). Written to core's password_reset_expiry_hours.
    maxeme.password_reset_hours: 24

    # Modules under modules/ that stay Active. `app:maxeme:setup` switches every other installed
    # module off (App Management's own kill switch: it deletes nothing, and each can be switched
    # back on there or with app:bundle:activate). The shop's parts use core's product catalogue:
    # InventoryDepth gives the stock detail page, Stock Adjustment and Movement History;
    # Procurement gives Vendors (only that is in the menu). The other B2B modules stay off.
    maxeme.enabled_bundles:
        - InventoryDepthBundle
        - ProcurementBundle

    # The shop's one stock location. Core keeps every stock count and hold against a warehouse
    # serving a fulfillment region; `app:maxeme:setup` creates it (and the region) when missing.
    maxeme.warehouse:
        region: Main
        province: BC
        country: CA

    # Printed on invoices and work orders (the legacy app hard-coded these in four templates).
    maxeme.company:
        name: 'Maxeme Automotive Service Ltd.'
        address: '2-2300 Simpson Rd, Richmond, BC V6X 2P9'
        phone: '(604)285-8200'
        pst_number: '1051 4680'
        # The website's booking / contact form, linked from service reminder emails ({{booking link}}).
        # TODO: ask Ken for the link. Blank leaves the link out.
        booking_url: ''

    # PDFs are rendered by dompdf, whose bundled fonts have no Chinese glyphs. Point this at a
    # TrueType font that has them (e.g. Noto Sans TC) to print Chinese names; when the file does not
    # exist the PDFs use DejaVu Sans.
    maxeme.pdf_font: '%kernel.project_dir%/var/fonts/NotoSansTC-Regular.ttf'

    # Reminder Todo's: an appointment this many months ago, with nothing booked since, becomes a reminder.
    maxeme.reminder_after_months: 6

    # Where each staff role's permission file lives ({key}_role_permission.php, one per
    # App\Maxeme\Security\StaffRole). First directory with the file wins.
    maxeme.rbac.role_permission_dirs:
        - '%kernel.project_dir%/config/rbac/role_permissions'

    # Core's own admin pages (the hidden B2B screens) are Super Admin only
    # (App\Maxeme\EventSubscriber\PermissionEnforcementSubscriber), except these, which a signed-out
    # or any signed-in staff member needs.
    maxeme.rbac.core_open_routes:
        - admin_login
        - admin_password_reset
        - admin_forgot_password
        - admin_account_setup

    # Core and module pages the shop uses for its parts (the product catalogue and its stock), and the
    # shop permission each needs, instead of Super Admin. Permission => route names (exact). Any core
    # route not listed stays Super Admin only.
    maxeme.rbac.core_route_permissions:
        /parts/view:
            - admin_product_redirect
            - admin_product_detail_index
            - admin_product_picker_search
            - admin_category_index
            - admin_product_unit_of_measure_index
            - admin_bundle_inventory_depth_stock_by_product
            - admin_bundle_inventory_depth_product_lookup
            - admin_bundle_inventory_depth_product_lookup_suggest
            - admin_bundle_inventory_depth_movements
            - admin_bundle_procurement_vendors
            - admin_bundle_procurement_vendor
            - admin_bundle_procurement_vendor_address_book
        /parts/edit:
            - admin_product_detail_columns_save
            - admin_product_inventory_create
            - admin_product_inventory_update
            - admin_product_delete
            - admin_product_import_index
            - admin_product_import_mapping
            - admin_product_import_confirm
            - admin_product_import_template
            - admin_product_import_template_guide
            - admin_category_create
            - admin_category_update
            - admin_category_toggle
            - admin_category_delete
            - admin_product_unit_of_measure_new
            - admin_product_unit_of_measure_edit
            - admin_product_unit_of_measure_save
            - admin_product_unit_of_measure_delete
            - admin_bundle_inventory_depth_stock_by_product_note_add
            - admin_bundle_inventory_depth_stock_by_product_note_update
            - admin_bundle_inventory_depth_stock_by_product_note_delete
            - admin_bundle_inventory_depth_adjust
            - admin_bundle_inventory_depth_adjust_submit
            - admin_bundle_procurement_vendor_create
            - admin_bundle_procurement_vendor_edit
            - admin_bundle_procurement_vendor_save
            - admin_bundle_procurement_vendor_deactivate
            - admin_bundle_procurement_vendor_activate
            - admin_bundle_procurement_vendor_address_form
            - admin_bundle_procurement_vendor_address_save
            - admin_bundle_procurement_vendor_address_delete
            - admin_bundle_procurement_vendor_contact_add
            - admin_bundle_procurement_vendor_contact_update
            - admin_bundle_procurement_vendor_contact_delete
            - admin_bundle_procurement_vendor_note_add
            - admin_bundle_procurement_vendor_note_update
            - admin_bundle_procurement_vendor_note_delete

    # The legacy Symfony 2 app's MySQL database, read only by app:maxeme:import-legacy.
    maxeme.legacy_database_url: '%env(default::LEGACY_DATABASE_URL)%'

    # The active modules' own sidebar groups, hidden like core's B2B entries: the screens the shop
    # uses from them are listed in maxeme.admin_menu instead.
    maxeme.hidden_module_menu_groups: [inventory, vendors, purchases, warehouse]

    # The admin sidebar. App\Maxeme\Menu\MaxemeAdminMenuProvider hides every core B2B entry (and
    # maxeme.hidden_module_menu_groups) and injects these instead.
    #   role:  rendering-only is_granted() check, a role or a permission such as /parts/view
    #          (each action enforces its own #[RequiresPermission])
    #   match: extra route-name prefixes that highlight the entry (its own route always does)
    #   add:   the row's "+": { label, route, params, modal (opened on arrival), role (default: the row's) }
    #          Repair Order / Appointments / Reminders need a client first: their + opens Choose a client.
    # Pages built but not listed here (Vehicles, Invoices) stay reachable
    # by URL and from the sidebar search.
    maxeme.admin_menu:
        - key: schedule
          label: Schedule
          icon: calendar
          children:
              - { key: repair_orders, label: Repair Order, route: maxeme_repair_order_index, role: /work-order/view, match: [maxeme_repair_order_, maxeme_work_order_],
                  add: { label: New repair order, route: maxeme_repair_order_new, role: /work-order/edit } }
              - { key: appointments, label: Appointments, route: maxeme_appointment_calendar, role: /appointment/view, match: [maxeme_appointment_],
                  add: { label: New appointment, route: maxeme_client_pick, params: { purpose: appointment }, role: /appointment/edit } }
              - { key: reminders, label: Reminders, route: maxeme_reminder_index, role: /reminder/view, match: [maxeme_reminder_],
                  add: { label: New reminder, route: maxeme_client_pick, params: { purpose: reminder }, role: /reminder/edit } }
              - { key: reminder_queue, label: Service Reminder Queue, route: maxeme_reminder_queue_index, role: /reminder/view, match: [maxeme_reminder_queue_] }
        - key: parts
          label: Parts & Service
          icon: wrench
          children:
              - { key: services, label: Services, route: maxeme_service_index, role: /service/view, match: [maxeme_service_index, maxeme_service_new, maxeme_service_edit, maxeme_service_delete, maxeme_service_export],
                  add: { label: Add a new service, route: maxeme_service_new, role: /service/edit } }
              # Parts are core's product catalogue and its stock (InventoryDepth, Procurement modules);
              # access follows maxeme.rbac.core_route_permissions.
              - { key: products, label: Products, route: admin_product_detail_index, role: /parts/view,
                  match: [admin_product_detail_, admin_product_inventory_, admin_product_redirect, admin_bundle_inventory_depth_stock_by_product, admin_bundle_inventory_depth_product_lookup],
                  add: { label: Add a product, route: admin_product_inventory_create, role: /parts/edit } }
              - { key: stock_adjustment, label: Stock Adjustment, route: admin_bundle_inventory_depth_adjust, role: /parts/edit }
              - { key: movements, label: Movement History, route: admin_bundle_inventory_depth_movements, role: /parts/view }
              - { key: product_import, label: Product Import, route: admin_product_import_index, role: /parts/edit, match: [admin_product_import_] }
              - { key: product_categories, label: Product Categories, route: admin_category_index, role: /parts/view, match: [admin_category_],
                  add: { label: Add a product category, route: admin_category_create, role: /parts/edit } }
              - { key: units_of_measure, label: UoM, route: admin_product_unit_of_measure_index, role: /parts/view, match: [admin_product_unit_of_measure_] }
              - { key: vendors, label: Vendors, route: admin_bundle_procurement_vendors, role: /parts/view, match: [admin_bundle_procurement_vendor],
                  add: { label: Add a vendor, route: admin_bundle_procurement_vendor_create, role: /parts/edit } }
        - key: people
          label: People
          icon: users
          role: /people/view
          children:
              - { key: clients, label: Client, route: maxeme_client_index, match: [maxeme_client_],
                  add: { label: Add a new client, route: maxeme_client_index, modal: manageAddModal, role: /people/edit } }
              - { key: vehicles, label: Vehicles, route: maxeme_vehicle_index, role: /car/view, match: [maxeme_vehicle_],
                  add: { label: Add a vehicle, route: maxeme_vehicle_new, role: /car/edit } }
        - key: accounting
          label: Accounting
          icon: chart
          role: /accounting/view
          children:
              - { key: summary_report, label: Payment Report, route: maxeme_report_summary, match: [maxeme_report_summary, maxeme_invoice_index, maxeme_invoice_find] }
              - { key: service_report, label: Service Report, route: maxeme_report_service, match: [maxeme_report_service] }
        # No role on the group: each row has its own (staff screens for /staff/view, the service
        # set-up screens for /service/view).
        - key: config
          label: Config
          icon: cog
          children:
              - { key: admin_users, label: Admin User, route: maxeme_staff_index, role: /staff/view, match: [maxeme_staff_],
                  add: { label: Add a new user, route: maxeme_staff_index, modal: register-modal, role: /staff/create } }
              # Read-only (Super Admin): access changes by editing config/rbac/role_permissions/, so no "+".
              - { key: roles, label: Roles, route: maxeme_role_index, role: /role/view, match: [maxeme_role_] }
              - { key: service_categories, label: Service Categories, route: maxeme_service_category_index, role: /service/view, match: [maxeme_service_category_],
                  add: { label: Add a service category, route: maxeme_service_category_new, role: /service/edit } }
              - { key: service_reminders, label: Service Reminders, route: maxeme_service_reminder_index, role: /service/view, match: [maxeme_service_reminder_index, maxeme_service_reminder_create, maxeme_service_reminder_update, maxeme_service_reminder_delete],
                  add: { label: Add a service reminder, route: maxeme_service_reminder_index, modal: reminderAddModal, role: /service/edit } }
              - { key: reminder_templates, label: Reminder Templates, route: maxeme_service_reminder_template_index, role: /service/view, match: [maxeme_service_reminder_template_],
                  add: { label: Add a reminder template, route: maxeme_service_reminder_template_new, role: /service/edit } }
              - { key: labour, label: Labour, route: maxeme_labour_index, role: /service/view, match: [maxeme_labour_],
                  add: { label: Add labour, route: maxeme_labour_index, modal: manageAddModal, role: /service/edit } }
              - { key: govt_fees, label: Government Fees, route: maxeme_govt_fee_index, role: /service/view, match: [maxeme_govt_fee_],
                  add: { label: Add a government fee, route: maxeme_govt_fee_index, modal: manageAddModal, role: /service/edit } }
        # The Settings page's tabs, one row each.
        - key: settings
          label: Settings
          icon: sliders
          role: /settings/manage
          children:
              - { key: tax_rates, label: Tax Rates, route: maxeme_settings, match: [maxeme_settings_tax_rates_] }
              - { key: tax_classes, label: Tax Classes, route: maxeme_settings_tax_class_index, match: [maxeme_settings_tax_class_],
                  add: { label: Add a tax class, route: maxeme_settings_tax_class_index, modal: manageAddModal } }
              - { key: doc_prefixes, label: Doc Prefixes, route: maxeme_settings_prefixes, match: [maxeme_settings_prefixes] }
              - { key: payment_types, label: Payment Types, route: maxeme_settings_payment_type_index, match: [maxeme_settings_payment_type_],
                  add: { label: Add a payment type, route: maxeme_settings_payment_type_index, modal: manageAddModal } }
              - { key: technicians, label: Technicians, route: maxeme_settings_technician_index, match: [maxeme_settings_technician_],
                  add: { label: Add a technician, route: maxeme_settings_technician_index, modal: manageAddModal } }
        - key: logs
          label: Logs
          icon: log
          role: /log/view
          children:
              - { key: activity, label: Activity Log, route: maxeme_activity_log_index, match: [maxeme_activity_log_] }
              # Core's own log screens (Super Admin only).
              - { key: email_log, label: Email Log, route: admin_email_log, role: ROLE_SUPER_ADMIN }
              - { key: error_log, label: Error Log, route: admin_error_log, role: ROLE_SUPER_ADMIN }
        # Core's phpLiteAdmin console (Super Admin, and Tech Support by inheritance).
        - key: database
          label: Database
          icon: database
          role: ROLE_SUPER_ADMIN
          children:
              - { key: database_console, label: Database Console, route: admin_db_console, match: [admin_db_] }

twig:
    globals:
        maxeme_company: '%maxeme.company%'

doctrine:
    orm:
        dql:
            string_functions:
                # Sidebar search: phone numbers compared without their punctuation (App\Maxeme\Listing\SearchTerm).
                REPLACE: App\Maxeme\Doctrine\ReplaceFunction
        mappings:
            Maxeme:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Maxeme/Entity'
                prefix: 'App\Maxeme\Entity'
                alias: Maxeme
