# Maxeme Auto: the shop-specific configuration layered on top of core.
#
# Services live in config/services.yaml (App\Maxeme\ section); routes in config/routes/maxeme.yaml.

parameters:
    # Written to the app settings core reads for site_name() by `app:maxeme:setup`.
    maxeme.app_name: 'Maxeme Auto'
    maxeme.company_name: 'Maxeme Automotive Service Ltd.'
    # The shop's timezone. Written to core's `timezone` setting (every date is stored in UTC and
    # shown in this zone) by app:maxeme:setup, and the zone the legacy database's wall-clock times
    # are read in by app:maxeme:import-legacy.
    maxeme.timezone: 'America/Vancouver'

    # Appointment calendar (legacy calendar-setting.js / AppointmentController), in shop time.
    maxeme.schedule:
        day_start: '07:00'          # first bookable slot
        day_end: '19:00'            # the calendar's last hour ends here
        slot_minutes: 15
        busy_slot_count: 5          # a slot with this many appointments starting in it shows as full
        default_duration_hours: 2   # the booking form's Duration

    # How long a forgot-password link stays valid, and how long before another can be requested
    # (the legacy FOSUserBundle token_ttl). Written to core's password_reset_expiry_hours.
    maxeme.password_reset_hours: 24

    # Modules under modules/ that stay Active. `app:maxeme:setup` switches every other installed
    # module off (App Management's own kill switch: it deletes nothing, and each can be switched
    # back on there or with app:bundle:activate). The B2B modules have no place in the shop.
    maxeme.enabled_bundles: []

    # Printed on invoices and work orders (the legacy app hard-coded these in four templates).
    maxeme.company:
        name: 'Maxeme Automotive Service Ltd.'
        address: '2-2300 Simpson Rd, Richmond, BC V6X 2P9'
        phone: '(604)285-8200'
        pst_number: '1051 4680'
        # The website's booking / contact form, linked from service reminder emails ({{booking link}}).
        # TODO: ask Ken for the link. Blank leaves the link out.
        booking_url: ''

    # Invoice taxes, in percent. The builder toggles each between 0 and its rate (legacy GST 5 / PST 7).
    maxeme.invoice:
        gst_rate: 5
        pst_rate: 7

    # PDFs are rendered by dompdf, whose bundled fonts have no Chinese glyphs. Point this at a
    # TrueType font that has them (e.g. Noto Sans TC) to print Chinese names; when the file does not
    # exist the PDFs use DejaVu Sans.
    maxeme.pdf_font: '%kernel.project_dir%/var/fonts/NotoSansTC-Regular.ttf'

    # Reminder Todo's: an appointment this many months ago, with nothing booked since, becomes a reminder.
    maxeme.reminder_after_months: 6

    # Where each staff role's permission file lives ({key}_role_permission.php, one per
    # App\Maxeme\Security\StaffRole). First directory with the file wins.
    maxeme.rbac.role_permission_dirs:
        - '%kernel.project_dir%/config/rbac/role_permissions'

    # Core's own admin pages (the hidden B2B screens) are Super Admin only
    # (App\Maxeme\EventSubscriber\PermissionEnforcementSubscriber), except these, which a signed-out
    # or any signed-in staff member needs.
    maxeme.rbac.core_open_routes:
        - admin_login
        - admin_password_reset
        - admin_forgot_password
        - admin_account_setup

    # The legacy Symfony 2 app's MySQL database, read only by app:maxeme:import-legacy.
    maxeme.legacy_database_url: '%env(default::LEGACY_DATABASE_URL)%'

    # The admin sidebar. App\Maxeme\Menu\MaxemeAdminMenuProvider hides every core B2B entry and
    # injects these instead.
    #   role:  rendering-only is_granted() check, a role or a permission such as /parts/view
    #          (each action enforces its own #[RequiresPermission])
    #   match: extra route-name prefixes that highlight the entry (its own route always does)
    #   add:   the row's "+": { label, route, params, modal (opened on arrival), role (default: the row's) }
    #          Repair Order / Appointments / Reminders need a client first: their + opens Choose a client.
    # Pages built but not listed here (Vehicles, Invoices) stay reachable
    # by URL and from the sidebar search.
    maxeme.admin_menu:
        - key: schedule
          label: Schedule
          icon: calendar
          children:
              - { key: repair_orders, label: Repair Order, route: maxeme_repair_order_index, role: /work-order/view, match: [maxeme_repair_order_, maxeme_work_order_],
                  add: { label: New repair order, route: maxeme_client_pick, params: { purpose: repair_order }, role: /people/view } }
              - { key: appointments, label: Appointments, route: maxeme_appointment_calendar, role: /appointment/view, match: [maxeme_appointment_],
                  add: { label: New appointment, route: maxeme_client_pick, params: { purpose: appointment }, role: /appointment/edit } }
              - { key: reminders, label: Reminders, route: maxeme_reminder_index, role: /reminder/view, match: [maxeme_reminder_],
                  add: { label: New reminder, route: maxeme_client_pick, params: { purpose: reminder }, role: /reminder/edit } }
        - key: parts
          label: Parts & Service
          icon: wrench
          children:
              - { key: services, label: Services, route: maxeme_service_index, role: /service/view, match: [maxeme_service_index, maxeme_service_create, maxeme_service_update, maxeme_service_delete, maxeme_service_export],
                  add: { label: Add a new service, route: maxeme_service_index, modal: manageAddModal, role: /service/edit } }
              - { key: inventory, label: Parts Inventory, route: maxeme_part_index, role: /parts/view, match: [maxeme_part_],
                  add: { label: Add a new part, route: maxeme_part_index, modal: manageAddModal, role: /parts/edit } }
        - key: people
          label: People
          icon: users
          role: /people/view
          children:
              - { key: clients, label: Client, route: maxeme_client_index, match: [maxeme_client_, maxeme_vehicle_],
                  add: { label: Add a new client, route: maxeme_client_index, modal: manageAddModal, role: /people/edit } }
        - key: accounting
          label: Accounting
          icon: chart
          role: /accounting/view
          children:
              - { key: summary_report, label: Summary Report, route: maxeme_report_summary, match: [maxeme_report_, maxeme_invoice_index, maxeme_invoice_find] }
        # No role on the group: each row has its own (staff screens for /staff/view, the service
        # set-up screens for /service/view).
        - key: config
          label: Config
          icon: cog
          children:
              - { key: admin_users, label: Admin User, route: maxeme_staff_index, role: /staff/view, match: [maxeme_staff_],
                  add: { label: Add a new admin user, route: maxeme_staff_index, modal: register-modal, role: /staff/create } }
              # Read-only (Super Admin): access changes by editing config/rbac/role_permissions/, so no "+".
              - { key: roles, label: Roles, route: maxeme_role_index, role: /role/view, match: [maxeme_role_] }
              - { key: settings, label: Settings, route: maxeme_settings, role: /settings/manage, match: [maxeme_settings] }
              - { key: service_categories, label: Service Categories, route: maxeme_service_category_index, role: /service/view, match: [maxeme_service_category_],
                  add: { label: Add a service category, route: maxeme_service_category_new, role: /service/edit } }
              - { key: service_reminders, label: Service Reminders, route: maxeme_service_reminder_index, role: /service/view, match: [maxeme_service_reminder_index, maxeme_service_reminder_create, maxeme_service_reminder_update, maxeme_service_reminder_delete],
                  add: { label: Add a service reminder, route: maxeme_service_reminder_index, modal: reminderAddModal, role: /service/edit } }
              - { key: reminder_templates, label: Reminder Templates, route: maxeme_service_reminder_template_index, role: /service/view, match: [maxeme_service_reminder_template_],
                  add: { label: Add a reminder template, route: maxeme_service_reminder_template_new, role: /service/edit } }
              - { key: labour, label: Labour, route: maxeme_labour_index, role: /service/view, match: [maxeme_labour_],
                  add: { label: Add labour, route: maxeme_labour_index, modal: manageAddModal, role: /service/edit } }
              - { key: govt_fees, label: Government Fees, route: maxeme_govt_fee_index, role: /service/view, match: [maxeme_govt_fee_],
                  add: { label: Add a government fee, route: maxeme_govt_fee_index, modal: manageAddModal, role: /service/edit } }
        - key: logs
          label: Logs
          icon: log
          role: /log/view
          children:
              - { key: activity, label: Activity Log, route: maxeme_activity_log_index, match: [maxeme_activity_log_] }
              # Core's own log screens (Super Admin only).
              - { key: email_log, label: Email Log, route: admin_email_log, role: ROLE_SUPER_ADMIN }
              - { key: error_log, label: Error Log, route: admin_error_log, role: ROLE_SUPER_ADMIN }

twig:
    globals:
        maxeme_company: '%maxeme.company%'

doctrine:
    orm:
        dql:
            string_functions:
                # Sidebar search: phone numbers compared without their punctuation (App\Maxeme\Listing\SearchTerm).
                REPLACE: App\Maxeme\Doctrine\ReplaceFunction
        mappings:
            Maxeme:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Maxeme/Entity'
                prefix: 'App\Maxeme\Entity'
                alias: Maxeme
