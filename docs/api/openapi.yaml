# Customer API — OpenAPI description.
#
# This file documents what the code does; it does not define it. The endpoint is a thin wrapper
# (src/Controller/Api/ProductApiController.php) that renames query parameters
# (src/Api/CatalogParams.php), forwards to the customer controller that already serves the same page
# on the website, and serialises the result through an explicit payload (src/Api/ProductPresenter.php).
#
# So when something here disagrees with those three files, they are right and this is stale. Two of
# them exist precisely so the contract is a short, readable list:
#   - accepted parameters  -> CatalogParams::PARAMS + CatalogParams::FILTER_PREFIX
#   - emitted fields       -> ProductPresenter::FIELDS
# Both are asserted exactly (equality, not subset) by tests/Functional/ApiProductListCest.php, so a
# field cannot appear or vanish without a test failing.

openapi: 3.1.0

info:
  title: Wholesale B2B Customer API
  version: '1.0'
  description: |
    A read API over the same catalog the signed-in customer sees on the website.

    **The key is a person.** A request authenticates as the customer user the key belongs to, and
    then runs through the ordinary customer controllers. Company scoping, price lists, catalog
    visibility, fulfillment region and role permissions therefore apply exactly as they do in the
    browser — there is no separate API permission model to keep in sync, and no way for the API to
    return something the same user could not see by logging in.

    Two consequences worth stating plainly:

    * Two users at the same company can get **different prices and different products** from the
      same request, if that is what the site shows them.
    * Switching a user off in the admin console (or their company, or their account status) takes
      effect on the very next request. Nothing has to be regenerated, and re-enabling restores the
      existing key.

    **Access is granted twice.** API access is enabled for the company, by an administrator, and
    then for the individual user — by an administrator or by that company's own owner. Only then
    can that user mint their own key, themselves, from `/profile/api-key`.

    An owner deciding *who may hold a key* is a separate thing from holding one. Nobody — not
    support, not an administrator, not the company owner — can see, create, rotate or revoke a key
    on someone else's behalf. Lost keys are regenerated by the person they belong to, and there is
    no lookup for anyone else.

servers:
  - url: https://{host}
    description: Your store's own domain.
    variables:
      host:
        default: example.com

security:
  - ApiKeyAuth: []

tags:
  - name: Catalog
    description: Products, as the authenticated user sees them.

paths:
  /api/v1/products:
    get:
      tags: [Catalog]
      operationId: listProducts
      summary: List products
      description: |
        Returns one page of the catalog, filtered and sorted the same way the website's catalog page
        filters and sorts it.

        Paging is fixed at 24 products per page (`perPage` in the response says so rather than
        making you assume it). Walk pages until `page` reaches `pages`.

        Every parameter below is optional except `region`, which becomes required only for companies
        that have more than one fulfillment region — and when it is required and missing you get a
        `400` naming the parameter and listing the values that would have worked, rather than a
        silent empty result.

        Unknown query parameters are ignored, not rejected. The accepted set is declared in
        `CatalogParams::PARAMS`; anything outside it never reaches the catalog.
      parameters:
        - name: region
          in: query
          required: false
          description: |
            Fulfillment region to browse. Required only when your company has more than one; with a
            single region it is inferred and may be omitted. The values your company may use are
            returned in `allowedValues` on the 400 response.
          schema:
            type: string
          example: WEST
        - name: q
          in: query
          required: false
          description: Free-text search, matched the same way the site's catalog search box matches it.
          schema:
            type: string
          example: winter tire
        - name: category
          in: query
          required: false
          description: |
            Product category id. Non-numeric values are ignored rather than rejected, which means a
            typo returns the unfiltered catalog — check `total` if that would surprise you.
          schema:
            type: integer
            minimum: 1
          example: 12
        - name: page
          in: query
          required: false
          description: 1-based page number. Values past `pages` return an empty `products` array.
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: sort
          in: query
          required: false
          description: |
            Column to sort by. Anything outside this list — including `name` — is ignored and the
            default order (name, ascending) applies. That is deliberate: an unrecognised sort must
            not become an error, and must not reach the query.
          schema:
            type: string
            enum: [description, sku, unit, size, price, stock, remarks]
        - name: dir
          in: query
          required: false
          description: Sort direction. Anything other than `desc` is read as `asc`.
          schema:
            type: string
            enum: [asc, desc]
            default: asc
        - name: cf
          in: query
          required: false
          description: |
            Facet filters, keyed by facet slug: `?cf[rim_pcd]=5x112`, or repeated for OR-within-facet
            as `?cf[rim_pcd][]=5x112&cf[rim_pcd][]=5x114.3`.

            Which slugs exist depends on the category being browsed and on what this installation has
            configured, so there is no fixed list to publish here — the slugs are the same ones the
            category page's filter checkboxes submit. An unknown slug matches nothing rather than
            erroring.
          style: deepObject
          explode: true
          schema:
            type: object
            additionalProperties:
              oneOf:
                - type: string
                - type: array
                  items:
                    type: string
          example:
            rim_pcd: ['5x112']
      responses:
        '200':
          description: One page of the catalog.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductList'
        '400':
          description: |
            `region` is required for this company and was not supplied. The response names the
            parameter and lists the acceptable values.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParameterError'
        '401':
          description: |
            Not identified. One of: no `X-Api-Key` header, an unknown key, a key the owner revoked,
            or an account that can no longer sign in (inactive user, inactive/pending company). The
            `error` string distinguishes these — it is meant to be readable by whoever is debugging
            the integration.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: |
            Identified, and refused. Either an administrator has switched API access off for the
            company or for this user (`error` says which), or the requested region is not one this
            company may browse (`{"blocked": true}`).
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/Error'
                  - $ref: '#/components/schemas/Blocked'
        '429':
          description: |
            Rate limited. 60 requests per minute per key; a lower, per-IP limit also applies to
            requests that fail to identify a key at all, so that guessing keys is bounded the same
            way guessing passwords is.
          headers:
            Retry-After:
              description: Seconds to wait before retrying.
              schema:
                type: integer
                minimum: 1
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-Api-Key
      description: |
        Header only. The key is never accepted in a query string, so it cannot end up in browser
        history, `Referer` headers, proxy logs or access logs.

  schemas:
    ProductList:
      type: object
      required: [products, total, page, pages, perPage, region, query]
      properties:
        products:
          type: array
          items:
            $ref: '#/components/schemas/Product'
        total:
          type: integer
          description: Products matching the filters across all pages, not the length of `products`.
          example: 137
        page:
          type: integer
          description: The page returned.
          example: 1
        pages:
          type: integer
          description: Total pages available for these filters. Always at least 1.
          example: 6
        perPage:
          type: integer
          description: Fixed page size. Published rather than assumed.
          example: 24
        region:
          type: [string, 'null']
          description: The region this response was priced and stocked for.
          example: WEST
        query:
          type: string
          description: The search term that was applied, echoed back. Empty when none was.
          example: winter tire

    Product:
      type: object
      description: |
        Exactly these fields, always all of them. The list is `ProductPresenter::FIELDS` and a test
        asserts equality against it, so nothing appears here by accident and nothing disappears
        quietly either.

        Custom fields are deliberately absent. They are per-installation, admin-created data, and
        whether a given one may be published is not a judgement this API can make on an
        administrator's behalf — that needs a per-field setting (issue #527).
      required:
        - id
        - sku
        - name
        - category
        - unit
        - size
        - description
        - remarks
        - image
        - inStock
        - availableQuantity
        - companyPrice
        - retailPrice
      properties:
        id:
          type: integer
          example: 4821
        sku:
          type: string
          example: TR-225-45-17
        name:
          type: string
          example: All-Season Touring 225/45R17
        category:
          type: string
          description: Category name, not id. Empty string when the product has no category.
          example: Tires
        unit:
          type: string
          example: EA
        size:
          type: string
          example: 225/45R17
        description:
          type: string
        remarks:
          type: string
        image:
          type: [string, 'null']
          description: Absolute URL, or null when the product has no image.
          format: uri
          example: https://example.com/uploads/products/tr-225-45-17.jpg
        inStock:
          type: boolean
          description: |
            `availableQuantity > 0`. The page prints "In stock"/"Out of stock"; this is that
            predicate, with the number it came from in the field below.
        availableQuantity:
          type: integer
          example: 42
        companyPrice:
          type: [number, 'null']
          description: |
            The price **this user's company** pays, as a number.

            `null` means there is no price for this user — the website shows "TBD" here. It is not
            zero and is never serialised as zero; treat null as "do not import a price", not as free.
          example: 128.5
        retailPrice:
          type: [number, 'null']
          description: |
            The suggested retail price, as a number, or `null` when none is set. The same value the
            site shows this user.

            What you anchor on is your business, not ours: some integrations build up from a base,
            some cut down from MSRP, some ignore both. Both prices are published so you can pick.
          example: 189.99

    Error:
      type: object
      description: |
        `application/problem+json` (RFC 7807-ish). `error` is kept, unchanged, for every integrator
        already reading it — nothing here is a breaking change, only additions. `code` is the field
        to branch on instead of string-matching `error`/`detail`, which can be reworded without
        notice.
      required: [error]
      properties:
        error:
          type: string
          description: Human-readable reason, intended to be shown to whoever is debugging.
          example: Invalid API key.
        type:
          type: string
          description: A relative reference identifying the problem type, stable per `code`.
          example: /api/errors/invalid_api_key
        title:
          type: string
          description: Short, generic summary of the problem type (not this one instance).
          example: Invalid API key
        status:
          type: integer
          description: The HTTP status code, repeated in the body.
          example: 401
        detail:
          type: string
          description: Same string as `error` — the instance-specific explanation.
          example: Invalid API key.
        code:
          type: string
          description: |
            Stable, machine-parseable reason a caller can switch on. One of `missing_api_key`,
            `invalid_api_key`, `api_key_revoked`, `account_access_blocked`, `company_api_disabled`,
            `user_api_disabled`, `rate_limited`, `region_required`.
          example: invalid_api_key

    ParameterError:
      allOf:
        - $ref: '#/components/schemas/Error'
        - type: object
          required: [parameter, allowedValues]
          properties:
            parameter:
              type: string
              description: The query parameter that needs fixing.
              example: region
            allowedValues:
              type: array
              description: The values that would be accepted — your company's own regions.
              items:
                type: string
              example: [WEST, EAST]

    Blocked:
      type: object
      required: [blocked]
      properties:
        blocked:
          type: boolean
          const: true
          description: The requested region is not one this company may browse.
