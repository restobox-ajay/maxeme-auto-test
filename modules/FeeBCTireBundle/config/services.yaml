services:
    _defaults:
        autowire: true
        autoconfigure: true

    FeeBCTireBundle\:
        resource: '../src/'

    FeeBCTireBundle\Fee\BCTireFeeCalculator:
        tags: ['app.fee_calculator', 'app.fee_field_provider', 'app.cart_info_field']

    FeeBCTireBundle\Menu\BCTireFeeMenuItem:
        tags: ['app.fee_menu_item']

    FeeBCTireBundle\Bundle\FeeBCTireBundleDescriptor:
        tags: ['app.bundle_descriptor']

    FeeBCTireBundle\Hook\BCTireAdminOrderDetailProvider:
        tags: ['app.injection_point']

    FeeBCTireBundle\Hook\BCTireCustomerOrderDetailProvider:
        tags: ['app.injection_point']

    FeeBCTireBundle\Hook\BCTireInvoiceNoteProvider:
        tags: ['app.injection_point']
